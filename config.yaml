# Kanal 1 — genel ayarlar. Kanala özel ayarlar channels/<kanal>/channel.yaml içinde.
channel: k1

paths:
  jobs_dir: jobs
  ready_dir: ready
  db_path: data/shorts.db
  assets_dir: assets

# Sağlayıcı modu: "mock" (sahte, ücretsiz) | "live" (gerçek API'ler; Aşama 1 sonrası)
providers:
  mode: mock

llm:
  provider: anthropic
  # Ortamdaki ANTHROPIC_BASE_URL değişkeni yok sayılır; istekler her zaman buraya gider.
  base_url: https://api.anthropic.com
  model: claude-opus-5-5

# Bölüm 3 — format
format:
  width: 1080
  height: 1920
  aspect_ratio: "9:16"
  fps: 30
  min_duration_s: 30
  max_duration_s: 55
  target_duration_s: 45
  min_shots: 8
  max_shots: 11
  min_shot_s: 3
  max_shot_s: 7
  narration_words: [100, 130]
  max_sentence_words: 12

# Bölüm 13 — video modu
video:
  mode: hybrid                       # hybrid | full_ai
  resolution: "480p"                 # 480p | 720p (pilotta karşılaştırılacak)
  max_ai_video_seconds_per_video: 24 # hibrit modda video başı AI video üst sınırı
  min_generation_s: 4                # Seedance'in kabul ettiği en kısa süre
  max_generation_s: 30
  narration_padding_s: 0.3           # sahne süresi = anlatım süresi + bu pay
  max_concurrent_video_jobs: 3
  max_shot_retries: 2

keyframes:
  image_size: "2K"
  max_retries: 3
  pass_score: 8

# Bölüm 13 — bütçe koruması (USD)
budget:
  max_cost_per_video: 15.0
  max_cost_per_day: 50.0
  max_cost_per_month: 1000.0
  # Gün ya da ay harcaması tavanın bu oranına gelince yeni job başlamaz ve bildirim gider.
  stop_new_jobs_ratio: 0.9
  # Yeni job açarken ayrılan tahmini video maliyeti (hibrit mod).
  estimated_cost_per_video: 11.0

# Birim fiyatlar (USD). Aşama 1'de güncel dokümanlardan doğrulanacak.
pricing:
  seedance_per_s:
    "480p": 0.22
    "720p": 0.47
  keyframe_image: 0.13
  tts_per_1k_chars: 0.30
  sfx_per_call: 0.05
  llm_input_per_mtok: 4.0
  llm_output_per_mtok: 20.0
  llm_call_estimate: 0.30       # çağrı öncesi bütçe kontrolü için tahmini tavan

# Bölüm 11 — takvim ve tampon
schedule:
  timezone: America/New_York   # yayın saatlerinin saat dilimi
  local_timezone: Europe/Istanbul
  slots: ["11:00", "18:00"]
  min_approved_buffer: 14      # 7 gün × 2 video
  pipeline_target: 20          # onaylı + incelemede + üretimde
  max_new_jobs_per_day: 4
  planner_time: "02:00"        # yerel saat

review_app:
  host: 127.0.0.1
  port: 8080

notify:
  desktop: true
  telegram: false
  buffer_warning_below: 10

image_search:
  sources: [wikimedia, openverse, pexels]
  serpapi_enabled: false       # Google Görseller; yalnızca iç referans, varsayılan kapalı
  candidates_per_category: 20
  refs_per_shot: [3, 6]
